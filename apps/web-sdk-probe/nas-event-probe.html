<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAS 외부 이벤트 테스트</title><style>body{font:14px system-ui;color:var(--color-text-primary,#222);margin:18px}button{margin:6px 3px;padding:9px 14px;border-radius:8px;border:1px solid #999}#status{white-space:pre-wrap;line-height:1.6}</style><main><h3>NAS 외부 이벤트 테스트 · v2</h3><p>시작 후 3분 동안 NAS 이벤트를 기다립니다. 이벤트가 도착하면 무해한 메시지 1개만 보냅니다. 이 대화와 앱 화면을 열어 두세요.</p><button id="start" disabled>NAS 이벤트 대기 시작</button><button id="stop" disabled>중지</button><div id="status">호스트 연결 확인 중</div></main><script type="module">
let n=0,armed=false,timer=null,expiry=null,session=null,expiresAt=0,messageCap=false,epoch=0;const pending=new Map(),seen=new Set(),el=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop'),show=s=>el.textContent=s;
function invoke(method,params){return new Promise((resolve,reject)=>{const id=++n;const timeout=setTimeout(()=>{pending.delete(id);reject(Error('호스트 응답 시간 초과. 자동 재시도하지 않습니다.'))},12000);pending.set(id,{resolve,reject,timeout});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.jsonrpc!=='2.0')return;const p=pending.get(e.data.id);if(!p)return;pending.delete(e.data.id);clearTimeout(p.timeout);if(e.data.error)p.reject(Error(String(e.data.error?.message||'호스트 거부')));else p.resolve(e.data.result);});
async function call(args){const r=await invoke('tools/call',{name:'nas_event_probe_session',arguments:args});if(r?.isError)throw Error(r.content?.find(x=>x.type==='text')?.text||'도구 오류');if(!r?.structuredContent)throw Error('이벤트 도구 응답을 확인할 수 없습니다. 앱 도구를 새로 고쳐 주세요.');return r.structuredContent;}
function finish(text){armed=false;epoch++;clearTimeout(timer);clearTimeout(expiry);start.disabled=false;stop.disabled=true;if(text)show(text);}
async function halt(text){const k=session;finish(text);session=null;if(k)try{await call({action:'stop',session:k});}catch{}}
async function tick(myEpoch){if(!armed||myEpoch!==epoch)return;if(Date.now()>=expiresAt){await halt('3분 대기가 종료됐습니다.');return;}try{const r=await call({action:'poll',session});if(!armed||myEpoch!==epoch)return;
if(r.event){const id=r.event.id;if(!/^evt-[a-f0-9-]{36}$/.test(id)||seen.has(id))throw Error('잘못되었거나 중복된 이벤트입니다.');seen.add(id);clearTimeout(timer);const k=session;finish();start.disabled=true;let outcome='uncertain';
try{const prompt='NAS_EXTERNAL_EVENT_PROBE : NAS에서 별도로 발행한 파일 이벤트 '+id+' 를 수신했습니다. 수신했다면 “NAS 외부 이벤트 수신”이라고만 답해 주세요. 도구나 파일 작업은 실행하지 마세요.';
if(messageCap)await invoke('ui/message',{role:'user',content:[{type:'text',text:prompt}]});else if(window.openai?.sendFollowUpMessage)await window.openai.sendFollowUpMessage({prompt});else throw Error('메시지 전송 기능 없음');outcome='host_accepted';show('NAS 이벤트 '+id+' 전달을 호스트가 접수했습니다. 실제 답변은 대화에서 확인하세요.');
}catch(e){show('전달 결과를 확인하지 못했습니다. 중복 방지를 위해 재전송하지 않습니다. '+e.message);}
try{await call({action:'ack',session:k,eventId:id,outcome});}catch{show(el.textContent+'\n접수 기록 저장은 확인되지 않았습니다. 재전송하지 않습니다.');}session=null;start.disabled=false;return;}
if(r.state!=='waiting'){await halt('대기 종료: '+r.state);return;}show('NAS 이벤트 대기 중… 추가 클릭은 필요 없습니다.');timer=setTimeout(()=>tick(myEpoch),5000);
}catch(e){await halt('대기 중지: '+e.message);}}
start.onclick=async()=>{if(armed||start.disabled)return;start.disabled=true;stop.disabled=false;armed=true;const myEpoch=++epoch;try{const r=await call({action:'arm'});if(!armed||myEpoch!==epoch){if(r.session)await call({action:'stop',session:r.session});return;}session=r.session;expiresAt=r.expiresAt;expiry=setTimeout(()=>halt('3분 대기가 종료됐습니다.'),Math.max(0,expiresAt-Date.now()));await tick(myEpoch);}catch(e){finish('시작 실패: '+e.message);}};
stop.onclick=()=>halt('중지했습니다.');window.addEventListener('pagehide',()=>{finish();session=null;});
try{const r=await invoke('ui/initialize',{appInfo:{name:'nas-file-event-probe',version:'0.2.0'},appCapabilities:{},protocolVersion:'2026-01-26'});window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');messageCap=Boolean(r?.hostCapabilities?.message?.text||r?.hostCapabilities?.experimental?.['openai/message']);if(!messageCap&&!window.openai?.sendFollowUpMessage)throw Error('호스트 메시지 기능을 확인할 수 없습니다.');start.disabled=false;show('준비됨. 시작하면 NAS 이벤트 1개를 기다립니다.');}catch(e){show('연결 실패: '+e.message);}
</script></html>
